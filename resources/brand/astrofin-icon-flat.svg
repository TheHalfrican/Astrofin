<?xml version="1.0" encoding="UTF-8"?>
<!-- Astrofin app icon, flat variant for tiny raster sizes (16/24/32 px).
     Same rounded square and space gradient as astrofin-icon.svg, but with no
     nebula, no starfield and no outer glow — those turn to mush below ~48 px.
     The mark is set slightly larger (62% instead of 58%) and the ring opacity
     is raised to .75 so both shapes survive downsampling. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Astrofin">
  <defs>
    <linearGradient id="af-space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1326"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <clipPath id="af-squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#af-squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#af-space)"/>
    <g transform="translate(194.56 194.56) scale(22.6742857)">
      <circle cx="14" cy="14" r="13.25" fill="none" stroke="#6FE3FF" stroke-width="1.5" opacity=".75"/>
      <path d="M4 22.5 C11 21 18.5 15 23.5 4.5 C22.5 14 19 20 14.5 22.5 Z" fill="#6FE3FF"/>
    </g>
  </g>
</svg>
