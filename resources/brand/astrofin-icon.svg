<?xml version="1.0" encoding="UTF-8"?>
<!-- Astrofin app icon, 1024x1024 master.
     Deep-space rounded square (macOS-style 22% corner radius) with a violet
     nebula in the upper right, the astrofin-tokens starfield positions (af-stars-1) scaled up,
     and the Astrofin logo mark at 58% of the box with a cyan outer glow.
     Palette from src/web/astrofin-tokens.css. Rasterized by
     dev/tools/brand/build-icons.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Astrofin">
  <defs>
    <linearGradient id="af-space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1326"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <radialGradient id="af-nebula" cx=".74" cy=".26" r=".62">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#8B6CFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="af-squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
    <filter id="af-glow" x="-30%" y="-30%" width="160%" height="160%"
            filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g clip-path="url(#af-squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#af-space)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#af-nebula)"/>

    <!-- Starfield: the af-stars-1 token positions, scaled to 1024. -->
    <g opacity=".7">
      <circle cx="122.9" cy="184.3" r="3.2" fill="#EAF0FF"/>
      <circle cx="327.7" cy="634.9" r="2.8" fill="#CFE0FF"/>
      <circle cx="593.9" cy="122.9" r="3.6" fill="#FFFFFF"/>
      <circle cx="757.8" cy="450.6" r="2.6" fill="#BFD4FF"/>
      <circle cx="901.1" cy="737.3" r="3.0" fill="#EAF0FF"/>
      <circle cx="225.3" cy="860.2" r="2.4" fill="#AFC4FF"/>
      <circle cx="471.0" cy="348.2" r="3.2" fill="#FFFFFF"/>
      <circle cx="675.8" cy="901.1" r="2.6" fill="#DCE8FF"/>
    </g>

    <!-- Cyan halo: a blurred duplicate of the mark. -->
    <g filter="url(#af-glow)" opacity=".35">
      <g transform="translate(215 215) scale(21.2142857)">
        <circle cx="14" cy="14" r="13.25" fill="none" stroke="#6FE3FF" stroke-width="1.5"/>
        <path d="M4 22.5 C11 21 18.5 15 23.5 4.5 C22.5 14 19 20 14.5 22.5 Z" fill="#6FE3FF"/>
      </g>
    </g>

    <!-- The mark itself. Ring is lifted to .6 so it survives 16-32 px. -->
    <g transform="translate(215 215) scale(21.2142857)">
      <circle cx="14" cy="14" r="13.25" fill="none" stroke="#6FE3FF" stroke-width="1.5" opacity=".6"/>
      <path d="M4 22.5 C11 21 18.5 15 23.5 4.5 C22.5 14 19 20 14.5 22.5 Z" fill="#6FE3FF"/>
    </g>
  </g>
</svg>
