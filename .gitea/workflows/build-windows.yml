# Gitea Actions workflow (Gitea ignores .github/workflows when this folder exists).
#
# Runs on the self-hosted act_runner "noahm-pc" (label windows-latest, host mode),
# which already has Visual Studio Build Tools, MSYS2 (C:\msys64) and Rust installed.
# Instead of re-downloading CEF and rebuilding libmpv on every run, the job links
# .cache/, third_party/mpv-install and build/ to a persistent cache directory on
# the runner, so a typical run is an incremental cargo build.
#
# Windows arm64 and macOS builds are GitHub-only (see .github/workflows); there is
# no runner for them here.
name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      RUNNER_CACHE_ROOT: C:\Users\NoahM\act_runner\cache\astrofin
      # act_runner's host-mode workspace is
      #   C:\Users\NoahM\act_runner\workspaces\<16 hex>\hostexecutor   (66 chars)
      # and cef-dll-sys' bundled CMake/ninja build writes object paths up to 198
      # characters below the repo root, e.g.
      #   build\cargo-target\release\build\cef-dll-sys-<hash>\out\build\
      #   libcef_dll_wrapper\CMakeFiles\libcef_dll_wrapper.dir\ctocpp\test\
      #   api_version_test_ref_ptr_library_child_child_v2_ctocpp.cc.obj
      # 66 + 1 + 198 = 265 > MAX_PATH (260), and cl.exe does not honour the
      # machine's LongPathsEnabled, so the longest ~30 wrapper objects die with
      # "fatal error C1083: Cannot open compiler generated file: ''" while ninja
      # only reports "build stopped: subcommand failed".
      #
      # Every step below therefore runs through a short junction to the
      # workspace. Nothing is copied; only the paths handed to CMake get shorter.
      # A single fixed alias is safe because the runner has capacity 1.
      # (`cargo clippy`/`cargo test` write to src\target\debug, 10 characters
      # shorter, which is why lint+test passed while "Build and package" did not.)
      SHORT_WORKSPACE: C:\astrofin-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Link persistent caches and shorten the workspace path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:RUNNER_CACHE_ROOT
          $mpvSha = (git -C third_party/mpv rev-parse HEAD).Trim()
          $links = @(
            @{ link = '.cache';                   target = "$root\cache" },
            @{ link = 'build';                    target = "$root\build" },
            @{ link = 'third_party\mpv-install';  target = "$root\mpv-install-$mpvSha" }
          )
          # Never Remove-Item -Recurse a path that may already be a junction into
          # the persistent cache: unlink it explicitly instead. Join-Path (not
          # Convert-Path/Resolve-Path) so the link, not its target, is addressed.
          function Remove-LinkOrDir([string]$path) {
            $item = Get-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            if (-not $item) { return }
            if ($item.LinkType) { [IO.Directory]::Delete($path, $false) }
            else { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          foreach ($l in $links) {
            New-Item -ItemType Directory -Force $l.target | Out-Null
            Remove-LinkOrDir (Join-Path (Get-Location).Path $l.link)
            New-Item -ItemType Junction -Path $l.link -Target $l.target | Out-Null
            "linked $($l.link) -> $($l.target)"
          }
          Remove-LinkOrDir $env:SHORT_WORKSPACE
          New-Item -ItemType Junction -Path $env:SHORT_WORKSPACE -Target (Get-Location).Path | Out-Null
          "linked $env:SHORT_WORKSPACE -> $(Get-Location)"

      - name: Build libmpv (skipped when the cache for this submodule commit exists)
        shell: pwsh
        run: |
          Set-Location $env:SHORT_WORKSPACE
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          pwsh -ExecutionPolicy Bypass -File dev\windows\build_mpv_source.ps1 -Arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch CEF (cached)
        shell: pwsh
        run: |
          Set-Location $env:SHORT_WORKSPACE
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          cargo xtask fetch-cef
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint (fmt + clippy) and test
        shell: pwsh
        run: |
          Set-Location $env:SHORT_WORKSPACE
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          . dev\windows\env.ps1
          cargo fmt --manifest-path src/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src/Cargo.toml --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer tooling (WiX as a user-scope dotnet tool; NSIS into the linked .cache)
        shell: pwsh
        run: |
          Set-Location $env:SHORT_WORKSPACE
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 5.*
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (wix extension list --global | Select-String -SimpleMatch WixToolset.UI.wixext)) {
            wix extension add --global WixToolset.UI.wixext/5.0.2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          wix --version
          pwsh -NoProfile -ExecutionPolicy Bypass -File dev\windows\fetch-nsis.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package
        shell: pwsh
        run: |
          Set-Location $env:SHORT_WORKSPACE
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:USERPROFILE\.dotnet\tools;$env:Path"
          . dev\windows\env.ps1
          cargo xtask package --external-mpv "$PWD\third_party\mpv-install" --prefix build/install --dist dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Wrap the tree cargo xtask staged in build\ into the NSIS and MSI
          # installers (package.ps1 re-mirrors build\ into its own payload dir).
          pwsh -NoProfile -ExecutionPolicy Bypass -File dev\windows\package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # v3, not v4: upload-artifact@v4 refuses any server that is not
      # github.com ("not currently supported on GHES"), while Gitea implements
      # the v3 artifact protocol. The GitHub workflow keeps v4.
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi

      - name: Drop the short workspace junction
        if: always()
        shell: pwsh
        run: |
          $item = Get-Item -LiteralPath $env:SHORT_WORKSPACE -Force -ErrorAction SilentlyContinue
          if ($item -and $item.LinkType) { [IO.Directory]::Delete($env:SHORT_WORKSPACE, $false) }
