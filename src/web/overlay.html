<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Astrofin</title>
    <!-- theme.css is generated by the native side (--bg-color). Kept for
         compatibility; the Astrofin tokens below supersede it. -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="astrofin-fonts.css">
    <link rel="stylesheet" href="astrofin-tokens.css">
    <link rel="stylesheet" href="overlay.css">
</head>
<body data-state="boot">
    <div class="af-sky" aria-hidden="true">
        <div class="af-stars af-stars--near"></div>
        <div class="af-stars af-stars--far"></div>
        <div class="af-nebula"></div>
    </div>

    <header class="af-header">
        <div class="af-brand">
            <img class="af-brand-mark" src="logo-mark.svg" alt="" width="28" height="28">
            <span class="af-wordmark">Astrofin</span>
        </div>
    </header>

    <main id="container" class="af-stage">
        <section class="af-card">
            <p class="af-eyebrow">Server</p>
            <h1 id="title"></h1>

            <form id="connect-form" class="af-form" novalidate>
                <input type="text" id="address" spellcheck="false" autocomplete="off"
                       autocapitalize="off" autocorrect="off" inputmode="url" autofocus>
                <div class="af-actions">
                    <button id="connect-button" type="submit"></button>
                </div>
            </form>

            <!-- One-line, non-blocking note (today: the plain-http fallback).
                 Empty until overlay.js fills it; `.af-note:empty` hides it. -->
            <p id="connect-note" class="af-note" role="status"></p>

            <div class="af-progress">
                <div id="spinner" class="af-orbit" role="status" aria-live="polite">
                    <span class="af-orbit-ring"></span>
                    <span class="af-orbit-ring af-orbit-ring--inner"></span>
                    <span class="af-orbit-track"><span class="af-orbit-dot"></span></span>
                </div>
                <p id="connect-status" class="af-status"></p>
                <button id="cancel-button" type="button" class="af-secondary"></button>
            </div>
        </section>
    </main>

    <footer class="af-footer" aria-hidden="true">
        <span>Enter&nbsp;&nbsp;Connect</span>
        <span>Esc&nbsp;&nbsp;Cancel</span>
    </footer>

    <script src="overlay.lang.js"></script>
    <script src="connectivityHelper.js"></script>
    <script src="overlay.js"></script>
</body>
</html>
