name: build-macos

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: echo "version=$(cargo run --quiet --manifest-path src/xtask/Cargo.toml -- version)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install \
            meson \
            ffmpeg \
            libplacebo \
            libass \
            luajit \
            vulkan-loader \
            vulkan-headers \
            molten-vk \
            sdl3 \
            libunibreak \
            zimg

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Build app bundle
        run: cargo xtask install --prefix build/output

      # The workspace links libmpv and builds CEF's C++ wrapper, so this is the
      # first point in the run where clippy and the tests can compile: the step
      # above meson-built libmpv into build/mpv-build and setup-cef unpacked the
      # CEF distribution into .cache/cef. Point cargo at both (the same env
      # `cargo xtask build` passes) so neither is downloaded or built twice, and
      # keep the target directory the build already populated.
      - name: Lint (clippy) and test
        run: |
          export CARGO_TARGET_DIR="$PWD/build/cargo-target"
          export CEF_PATH="$PWD/.cache/cef"
          export JFN_MPV_INCLUDE_DIR="$PWD/third_party/mpv/include"
          export JFN_MPV_LIB_DIR="$PWD/build/mpv-build"
          # libmpv.2.dylib sits in the meson build dir, not next to the test
          # binaries, and cargo only appends its own target dirs to this.
          export DYLD_FALLBACK_LIBRARY_PATH="$PWD/build/mpv-build:${DYLD_FALLBACK_LIBRARY_PATH:-$HOME/lib:/usr/local/lib:/usr/lib}"
          cargo clippy --manifest-path src/Cargo.toml --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo test --manifest-path src/Cargo.toml --workspace

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="Astrofin"
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          DMG_NAME="Astrofin-${VERSION}-macos-${ARCH}.dmg"
          mkdir -p dist

          # create-dmg returns non-zero if icon positioning fails (no icon), ignore that
          create-dmg \
            --volname "Astrofin v${VERSION}" \
            --no-internet-enable \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 125 150 \
            --app-drop-link 375 150 \
            "dist/${DMG_NAME}" "build/output/${APP_NAME}.app" || true

          # Verify DMG was created
          if [ ! -f "dist/${DMG_NAME}" ]; then
            echo "DMG creation failed"
            exit 1
          fi
          echo "Created: dist/${DMG_NAME}"
          ls -la "dist/${DMG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Astrofin-*.dmg
